<!DOCTYPE html>

<style>
:root{
  --bg:#eaf4ff;--bg2:#ffffff;--card:#ffffff;--text:#12304d;--muted:#5b7893;--primary:#1e88e5;--primary-d:#1565c0;
  --soft:#dcecfd;--line:#cfe2f6;--ok:#2e9e5b;--ok-bg:#e3f6ea;--bad:#e5484d;--bad-bg:#fdeaea;--shadow:0 6px 24px rgba(30,136,229,.12);
  --hdr:rgba(255,255,255,.92);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1622;--bg2:#0f1d2c;--card:#13273a;--text:#e6f1fb;--muted:#93acc4;--primary:#64b5f6;--primary-d:#90caf9;
    --soft:#193450;--line:#24435f;--ok:#4cc27f;--ok-bg:#12382a;--bad:#ff6b70;--bad-bg:#40191d;--shadow:0 6px 24px rgba(0,0,0,.35);
    --hdr:rgba(15,29,44,.92);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1622;--bg2:#0f1d2c;--card:#13273a;--text:#e6f1fb;--muted:#93acc4;--primary:#64b5f6;--primary-d:#90caf9;
  --soft:#193450;--line:#24435f;--ok:#4cc27f;--ok-bg:#12382a;--bad:#ff6b70;--bad-bg:#40191d;--shadow:0 6px 24px rgba(0,0,0,.35);
  --hdr:rgba(15,29,44,.92);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;line-height:1.65;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr);backdrop-filter:blur(8px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,28px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--primary-d);text-decoration:none;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:18px}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:.7rem;line-height:1}
nav{display:flex;gap:4px;align-items:center;margin-left:auto;overflow-x:auto;scrollbar-width:thin}
nav a{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;text-decoration:none;color:var(--text);font-weight:700;font-size:.88rem;white-space:nowrap;transition:.2s}
nav a .n{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.75rem;color:var(--primary-d)}
nav a:hover{background:var(--soft)}
nav a.active{background:var(--primary);color:#fff}
nav a.active .n{background:rgba(255,255,255,.25);color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px;flex:none}
#menuBtn{display:none}
.nav-title,.overlay{display:none}
main{max-width:920px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 60px}
.hero{background:linear-gradient(135deg,var(--primary),#42a5f5);color:#fff;border-radius:24px;padding:clamp(22px,5vw,44px);box-shadow:var(--shadow)}
.hero .tag{display:inline-block;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px;font-weight:700;font-size:.8rem}
.hero h1{margin:12px 0 6px;font-size:clamp(1.5rem,4.5vw,2.4rem);line-height:1.2}
.hero p{margin:0;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3.5vw,28px);margin-top:20px;box-shadow:var(--shadow)}
.card h2{margin:1.4em 0 .4em;font-size:1.15rem;color:var(--primary-d)}
.card h2:first-child,.card>h2.first{margin-top:0}
.card h3{margin:1.2em 0 .3em;font-size:1rem}
.card p{margin:.6em 0}
.card table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1em 0;font-size:.92rem}
.card th,.card td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.card th{background:var(--soft)}
details{background:var(--soft);border-radius:12px;padding:8px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:700;color:var(--primary-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.tile{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;transition:.2s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);border-color:var(--primary)}
.tile .n{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--primary-d);display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.tile b{display:block}
.pagehead{display:flex;align-items:center;gap:14px}
.pagehead .n{width:48px;height:48px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:800;flex:none}
.pagehead h1{margin:0;font-size:clamp(1.2rem,3.8vw,1.7rem);line-height:1.25}
.pagehead small{color:var(--muted);font-weight:700}
/* kuis */
.qwrap h2{margin:0 0 4px;color:var(--primary-d)}
.qcard{border:2px solid var(--line);border-radius:18px;padding:clamp(14px,3vw,22px);background:var(--card);transition:background .3s,border-color .3s;margin-top:12px}
.qcard.right{background:var(--ok-bg);border-color:var(--ok)}
.qcard.wrong{background:var(--bad-bg);border-color:var(--bad)}
.qcard.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(9px)}45%{transform:translateX(-8px)}60%{transform:translateX(6px)}75%{transform:translateX(-4px)}90%{transform:translateX(2px)}}
.qtext{font-weight:700;font-size:1.05rem;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:9px;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--primary-d)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right .l,.opt.wrong .l{background:rgba(255,255,255,.28);color:#fff}
.opt.dim{opacity:.6}
.fb{margin:14px 0 0;font-weight:800}
.fb.right{color:var(--ok)}.fb.wrong{color:var(--bad)}
.btn{display:inline-block;border:0;background:var(--primary);color:#fff;font:inherit;font-weight:800;padding:11px 22px;border-radius:999px;cursor:pointer;margin-top:14px;text-decoration:none;transition:.2s}
.btn:hover{background:var(--primary-d)}
.btn.ghost{background:var(--soft);color:var(--primary-d);margin-left:8px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--primary);transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:.9rem}
.score{text-align:center;padding:10px 0}
.score .big{font-size:clamp(3rem,12vw,4.6rem);font-weight:800;color:var(--primary-d);line-height:1}
.rev{list-style:none;padding:0;margin:14px 0}
.rev li{border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.93rem}
.rev li.ok{border-left-color:var(--ok)}.rev li.no{border-left-color:var(--bad)}
.rev small{display:block;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}
@media (max-width:1060px){
  #menuBtn{display:block}
  header{justify-content:space-between}
  .brand small{display:none}
  nav{position:fixed;top:0;left:0;bottom:0;width:min(290px,82vw);margin:0;z-index:80;flex-direction:column;align-items:stretch;gap:4px;
    background:var(--card);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow-y:auto;
    transform:translateX(-105%);transition:transform .3s;box-shadow:var(--shadow);border-right:1px solid var(--line)}
  nav.open{transform:none}
  nav a{border-radius:12px;font-size:.95rem;padding:11px 12px}
  .nav-title{display:block;font-weight:800;color:var(--primary-d);padding:6px 6px 12px}
  .overlay{position:fixed;inset:0;background:rgba(5,15,25,.5);z-index:40;display:none}
  .overlay.show{display:block}
}

/* Penyajian materi yang lebih ringan dan responsif */
.lesson-content{margin-top:18px}
.lesson-illustration{display:grid;grid-template-columns:minmax(180px,260px) 1fr;align-items:center;gap:22px;background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:20px;overflow:hidden}
.lesson-art{width:100%;max-width:260px;color:var(--primary-d)}
.lesson-illustration h2{margin:5px 0;color:var(--primary-d);font-size:1.3rem}
.lesson-illustration p{margin:0;color:var(--muted)}
.eyebrow{font-size:.76rem;letter-spacing:.08em;font-weight:800;color:var(--primary-d)}
.lesson-section{margin:18px 0}.section-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 4px 16px rgba(30,136,229,.06)}.section-body>*:first-child{margin-top:0}.section-body>*:last-child{margin-bottom:0}.lesson-subheading{display:flex;align-items:flex-start;gap:9px;margin:20px 0 9px;color:var(--primary-d);font-size:1.04rem}.lesson-subheading span{flex:0 0 auto}.section-body p{line-height:1.75}.section-body ul,.section-body ol{padding-left:1.5rem;line-height:1.75}.section-body table{width:100%;max-width:100%;border-collapse:collapse;display:block;overflow-x:auto}.section-body details{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface,rgba(30,136,229,.04))}
.section-heading{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.section-heading h2{font-size:1.2rem;line-height:1.3;margin:0;color:var(--primary-d)}
.section-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;background:var(--soft);font-size:1.35rem}
.point-card{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;margin:10px 0;box-shadow:0 3px 12px rgba(30,136,229,.06);min-width:0}
.point-card>div{min-width:0;flex:1}
.point-card p:first-child,.point-card h3:first-child{margin-top:0}
.point-card p:last-child{margin-bottom:0}
.point-card table{margin:4px 0}
.point-icon{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:10px;background:var(--soft);font-size:1.05rem}
.example-point{border-left:4px solid #ffbf47}
.table-point{display:block}
.table-point>.point-icon{margin-bottom:8px}
.subheading-point{background:var(--soft);box-shadow:none}
.subheading-point h3{margin:3px 0;color:var(--primary-d)}
.lesson-pager{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap}
.muted-note{color:var(--muted);margin:4px 0 10px}
.auto-next{margin-top:15px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--primary-d);font-weight:800;font-size:.9rem}
.mini-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.mini-progress i{display:block;width:100%;height:100%;background:var(--primary);transform-origin:left;animation:countdown 1.7s linear forwards}
@keyframes countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(max-width:640px){
 .lesson-illustration{grid-template-columns:1fr;gap:4px;padding:16px}
 .lesson-art{max-width:190px;margin:0 auto}
 .lesson-illustration h2{font-size:1.12rem}
 .point-card{padding:12px;gap:9px}.section-card{padding:15px 14px}.section-heading{align-items:flex-start}.section-body table{font-size:.92rem}
 .point-icon{width:29px;height:29px}
 .lesson-pager .btn{padding:10px 14px;font-size:.9rem}
}
@media(max-width:1060px){
 header{gap:8px}
 #menuBtn{order:-1}
 .brand{margin-right:auto;min-width:0;white-space:normal}
 nav#nav{width:min(320px,86vw);height:100dvh;max-height:100dvh;inset:0 auto 0 0;overscroll-behavior:contain;transform:translate3d(-110%,0,0);visibility:hidden;transition:transform .25s ease,visibility .25s}
 nav#nav.open{transform:translate3d(0,0,0);visibility:visible}
 .overlay{z-index:40}
 nav#nav{z-index:80}
 nav#nav a{flex:none}
 body.menu-open{overflow:hidden}
}
@media(min-width:1061px){#menuBtn{display:none}nav#nav{visibility:visible;transform:none}}

@media (prefers-reduced-motion:reduce){.qcard.shake{animation:none}}
</style>

<script>
const DATA = {"tujuan": "<p>Setelah mempelajari bab ini, peserta didik diharapkan mampu:<\/p><ul><li>Menjelaskan pengertian dan tujuan artikel ilmiah populer.<\/li><li>Mengidentifikasi ciri-ciri artikel ilmiah populer.<\/li><li>Membedakan fakta dan opini dalam artikel.<\/li><li>Mengumpulkan data melalui pengamatan, wawancara, studi pustaka, angket, dan dokumentasi.<\/li><li>Menggunakan kalimat perbandingan, analogi, sinonim, dan antonim secara tepat.<\/li><li>Menyusun artikel ilmiah populer melalui tahapan penulisan yang sistematis.<\/li><li>Membiasakan diri membaca, memahami, dan mencatat informasi melalui jurnal membaca.<\/li><\/ul>", "rangkuman": "<ul><li>Artikel ilmiah populer menyampaikan pengetahuan atau fenomena ilmiah dengan bahasa yang mudah dipahami masyarakat umum.<\/li><li>Ciri utamanya adalah didukung bukti, menggunakan bahasa komunikatif, membahas topik relevan, tersusun logis, dan menggunakan sumber yang dapat dipertanggungjawabkan.<\/li><li>Fakta dapat diverifikasi melalui bukti, sedangkan opini berisi pendapat, penilaian, atau saran.<\/li><li>Data dapat dikumpulkan melalui observasi, wawancara, studi pustaka, angket, dan dokumentasi.<\/li><li>Kalimat perbandingan menunjukkan persamaan atau perbedaan; analogi menjelaskan konsep melalui kemiripan; sinonim memiliki makna sama atau berdekatan; antonim memiliki makna berlawanan.<\/li><li>Penulisan artikel dilakukan melalui penentuan topik, perumusan pertanyaan, pengumpulan data, penyusunan kerangka, penulisan draf, dan penyuntingan.<\/li><li>Jurnal membaca membantu siswa mencatat ringkasan, fakta, opini, kosakata baru, tanggapan, dan ide untuk menulis.<\/li><\/ul>", "bab": [{"no": 1, "title": "Mengenal Artikel Ilmiah Populer", "short": "Mengenal Artikel", "html": "<h2 id=\"a.-pengertian-artikel-ilmiah-populer\">A. Pengertian Artikel Ilmiah Populer<\/h2>\n<p>Artikel ilmiah populer adalah tulisan yang membahas pengetahuan, hasil pengamatan, penelitian, atau fenomena ilmiah dengan menggunakan bahasa yang mudah dipahami oleh masyarakat umum.<\/p>\n<p>Kata ilmiah berarti isi tulisan didasarkan pada fakta, data, pengamatan, atau pengetahuan yang dapat dipertanggungjawabkan. Kata populer berarti tulisan disajikan dengan bahasa yang akrab bagi pembaca, bukan hanya untuk para ahli.<\/p>\n<p>Dengan demikian, artikel ilmiah populer membantu pembaca memahami ilmu pengetahuan tanpa harus mempelajari istilah yang terlalu rumit.<\/p>\n<h2 id=\"b.-tujuan-artikel-ilmiah-populer\">B. Tujuan Artikel Ilmiah Populer<\/h2>\n<p>Memberikan informasi: menyampaikan pengetahuan tentang suatu fenomena.<\/p>\n<p>Menambah wawasan: membantu pembaca memahami hal yang sebelumnya belum diketahui.<\/p>\n<p>Menjelaskan fenomena: menerangkan mengapa dan bagaimana suatu peristiwa terjadi.<\/p>\n<p>Meningkatkan kesadaran: mengajak pembaca memahami masalah lingkungan, kesehatan, teknologi, atau kehidupan sosial berdasarkan informasi tepercaya.<\/p>\n<p>Mendorong pemikiran kritis: membiasakan pembaca memeriksa bukti sebelum mempercayai informasi.<\/p>\n<h2 id=\"c.-topik-artikel-ilmiah-populer\">C. Topik Artikel Ilmiah Populer<\/h2>\n<p>Lingkungan: “Mengapa Pohon Penting bagi Kehidupan Manusia?”<\/p>\n<p>Kesehatan: “Mengapa Tidur yang Cukup Penting bagi Pelajar?”<\/p>\n<p>Teknologi: “Bagaimana Kecerdasan Buatan Membantu Pelajar Belajar?”<\/p>\n<p>Sains sehari-hari: “Mengapa Tanaman Membutuhkan Cahaya Matahari?”<\/p>\n<h2 id=\"d.-perbedaan-artikel-ilmiah-populer-dan-karya-ilmiah-akademik\">D. Perbedaan Artikel Ilmiah Populer dan Karya Ilmiah Akademik<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspek<\/strong><\/th>\n<th><strong>Artikel ilmiah populer<\/strong><\/th>\n<th><strong>Karya ilmiah akademik<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Pembaca<\/td>\n<td>Masyarakat umum<\/td>\n<td>Peneliti atau kalangan akademik<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bahasa<\/td>\n<td>Sederhana dan komunikatif<\/td>\n<td>Lebih formal dan teknis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tujuan<\/td>\n<td>Menjelaskan ilmu kepada masyarakat<\/td>\n<td>Melaporkan atau mengembangkan kajian ilmiah<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Penyajian<\/td>\n<td>Dapat memakai cerita, analogi, dan contoh<\/td>\n<td>Mengikuti struktur dan aturan akademik<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Data<\/td>\n<td>Berdasarkan sumber dan bukti tepercaya<\/td>\n<td>Mengikuti metode dan pelaporan akademik sesuai jenis karya<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"e.-contoh-artikel-ilmiah-populer-singkat\">E. Contoh Artikel Ilmiah Populer Singkat<\/h2>\n<p><strong>Pohon, Sahabat bagi Kehidupan<\/strong><\/p>\n<p>Pohon memiliki peran penting dalam kehidupan manusia. Daunnya menyerap karbon dioksida untuk proses fotosintesis dan menghasilkan oksigen. Akar pohon juga membantu menyerap air ke dalam tanah serta dapat mengurangi aliran air permukaan.<\/p>\n<p>Di lingkungan sekolah, pohon dapat memberikan keteduhan sehingga halaman terasa lebih nyaman. Oleh karena itu, merawat pohon bukan sekadar memperindah lingkungan, tetapi juga merupakan salah satu bentuk kepedulian terhadap kehidupan.<\/p>\n<h2 id=\"f.-aktivitas-interaktif\">F. Aktivitas Interaktif<\/h2>\n<p>Pertanyaan: Manakah topik yang paling tepat untuk dikembangkan menjadi artikel ilmiah populer?<\/p>\n<p>A. Pengalaman liburan yang hanya menceritakan kejadian pribadi.<\/p>\n<p>B. Penjelasan tentang penyebab banjir berdasarkan pengamatan dan data.<\/p>\n<p>C. Cerita khayalan tentang pohon yang dapat berbicara.<\/p>\n<details><summary>Lihat kunci jawaban<\/summary><p> B. Topik tersebut membahas fenomena nyata yang dapat dijelaskan menggunakan pengamatan dan data.<\/p><\/details>\n", "soal": [{"q": "Tulisan yang membahas pengetahuan, hasil pengamatan, penelitian, atau fenomena ilmiah dengan menggunakan bahasa yang mudah dipahami oleh masyarakat umum disebut...", "o": ["Karya ilmiah akademik", "Artikel ilmiah populer", "Teks laporan hasil observasi", "Jurnal penelitian"], "a": 1}, {"q": "Kata \"ilmiah\" dalam artikel ilmiah populer mengandung arti bahwa isi tulisan didasarkan pada...", "o": ["Pendapat pribadi penulis semata", "Fakta, data, dan pengamatan yang dapat dipertanggungjawabkan", "Khayalan dan imajinasi penulis", "Cerita fiksi yang beredar di masyarakat"], "a": 1}, {"q": "Sedangkan kata \"populer\" dalam istilah tersebut berarti...", "o": ["Tulisan disajikan dengan bahasa yang rumit dan akademis", "Tulisan hanya ditujukan untuk kalangan peneliti", "Tulisan disajikan dengan bahasa yang akrab bagi masyarakat umum", "Tulisan memuat rumus-rumus sains tingkat tinggi"], "a": 2}, {"q": "Berikut ini yang <b>bukan<\/b> merupakan tujuan dari penulisan artikel ilmiah populer adalah...", "o": ["Memberikan informasi tentang suatu fenomena", "Menambah wawasan pembaca", "Menyajikan laporan penelitian dengan struktur akademik yang kaku", "Mendorong pemikiran kritis pembaca"], "a": 2}, {"q": "Mengajak pembaca memahami masalah lingkungan, kesehatan, atau teknologi berdasarkan informasi tepercaya merupakan bagian dari tujuan artikel ilmiah populer, yaitu...", "o": ["Menjelaskan fenomena", "Meningkatkan kesadaran", "Mendorong pemikiran kritis", "Memberikan informasi"], "a": 1}, {"q": "Topik \"Mengapa Tidur yang Cukup Penting bagi Pelajar?\" termasuk ke dalam bidang...", "o": ["Lingkungan", "Teknologi", "Kesehatan", "Sains sehari-hari"], "a": 2}, {"q": "Perbedaan utama antara artikel ilmiah populer dan karya ilmiah akademik dari segi sasaran pembacanya adalah...", "o": ["Artikel ilmiah populer untuk masyarakat umum, karya ilmiah akademik untuk peneliti", "Artikel ilmiah populer untuk kalangan akademik, karya ilmiah akademik untuk masyarakat umum", "Keduanya ditujukan untuk masyarakat umum", "Keduanya ditujukan untuk kalangan peneliti"], "a": 0}, {"q": "Bahasa yang digunakan dalam karya ilmiah akademik umumnya bersifat...", "o": ["Sederhana dan komunikatif", "Lebih formal dan teknis", "Penuh dengan kiasan dan gaya bahasa", "Santai dan menggunakan bahasa gaul"], "a": 1}, {"q": "Dalam hal penyajian, artikel ilmiah populer boleh menggunakan hal-hal berikut agar menarik, <b>kecuali<\/b>...", "o": ["Cerita", "Analogi", "Contoh sehari-hari", "Pemalsuan data"], "a": 3}, {"q": "Manakah topik berikut yang paling tepat dikembangkan menjadi artikel ilmiah populer?", "o": ["Cerita petualangan fiksi di planet Mars", "Penjelasan penyebab banjir di lingkungan sekitar berdasarkan data", "Curahan hati seseorang saat sedang sedih", "Puisi tentang keindahan alam pegunungan"], "a": 1}, {"q": "“Akar pohon membantu menyerap air ke dalam tanah serta dapat mengurangi aliran air permukaan.” Kalimat tersebut berisi informasi yang bertujuan untuk...", "o": ["Menghibur pembaca", "Menjelaskan fenomena alam", "Mengkritik kebijakan pemerintah", "Menceritakan pengalaman pribadi"], "a": 1}, {"q": "Artikel ilmiah populer membantu pembaca memahami ilmu pengetahuan tanpa harus...", "o": ["Membaca teks secara keseluruhan", "Mempelajari istilah yang terlalu rumit", "Mengetahui sumber informasinya", "Memikirkan fakta yang disajikan"], "a": 1}, {"q": "Tujuan artikel ilmiah populer untuk \"menjelaskan fenomena\" berarti...", "o": ["Membiasakan pembaca memeriksa bukti", "Menyampaikan pengetahuan tentang suatu hal", "Menerangkan mengapa dan bagaimana suatu peristiwa terjadi", "Membantu pembaca memahami hal yang belum diketahui"], "a": 2}, {"q": "Ciri data yang disajikan dalam artikel ilmiah populer maupun karya ilmiah akademik adalah...", "o": ["Mengikuti tren media sosial", "Berdasarkan opini penulis tanpa bukti", "Berdasarkan sumber dan bukti tepercaya", "Dibuat semenarik mungkin walau tidak nyata"], "a": 2}, {"q": "Di lingkungan sekolah, merawat pohon bukan sekadar memperindah lingkungan, melainkan juga bentuk kepedulian karena pohon berfungsi menyerap...", "o": ["Oksigen", "Karbon monoksida", "Karbon dioksida", "Hidrogen"], "a": 2}]}, {"no": 2, "title": "Memahami Ciri-Ciri Artikel Ilmiah Populer", "short": "Ciri-Ciri", "html": "<h2 id=\"a.-isi-berdasarkan-fakta-dan-pengetahuan-ilmiah\">A. Isi Berdasarkan Fakta dan Pengetahuan Ilmiah<\/h2>\n<p>Artikel ilmiah populer menyampaikan informasi berdasarkan fakta, data, hasil pengamatan, penelitian, atau sumber tepercaya. Penulis tidak boleh membuat klaim seolah-olah benar tanpa dasar yang jelas.<\/p>\n<p>Contoh: “Pepohonan dapat memberikan keteduhan dan membantu mengurangi panas yang diterima permukaan tanah.” Pernyataan ini lebih hati-hati daripada klaim bahwa semua pohon pasti membuat setiap tempat menjadi sejuk.<\/p>\n<h2 id=\"b.-menggunakan-bahasa-yang-mudah-dipahami\">B. Menggunakan Bahasa yang Mudah Dipahami<\/h2>\n<p>Artikel ilmiah populer ditujukan kepada masyarakat umum. Karena itu, penulis sebaiknya menggunakan kalimat yang jelas, istilah yang sesuai, dan contoh yang dekat dengan kehidupan sehari-hari.<\/p>\n<p>Contoh: “Fotosintesis adalah proses ketika tumbuhan menggunakan cahaya matahari untuk membuat makanannya.” Istilah ilmiah tetap boleh digunakan, tetapi perlu dijelaskan jika pembaca mungkin belum memahaminya.<\/p>\n<h2 id=\"c.-membahas-topik-yang-dekat-dengan-kehidupan\">C. Membahas Topik yang Dekat dengan Kehidupan<\/h2>\n<p>Topik dapat berasal dari fenomena yang ditemui sehari-hari, seperti sampah, banjir, tidur, makanan, tumbuhan, penggunaan gawai, dan perkembangan teknologi.<\/p>\n<p>Mengapa genangan air dapat menjadi tempat berkembang biak nyamuk?<\/p>\n<p>Mengapa sampah plastik sulit terurai?<\/p>\n<p>Bagaimana kebiasaan tidur memengaruhi konsentrasi belajar?<\/p>\n<h2 id=\"d.-disusun-secara-logis-dan-sistematis\">D. Disusun secara Logis dan Sistematis<\/h2>\n<p>Artikel perlu memiliki urutan pembahasan yang masuk akal. Penulis dapat memulai dengan memperkenalkan masalah, menjelaskan penyebab atau prosesnya, memberikan bukti atau contoh, kemudian menyampaikan kesimpulan.<\/p>\n<p>Pembuka: memperkenalkan masalah sampah plastik di lingkungan sekolah.<\/p>\n<p>Pembahasan: menjelaskan sifat plastik, dampaknya, dan data hasil pengamatan.<\/p>\n<p>Penutup: menyimpulkan masalah dan memberikan saran pengurangan sampah.<\/p>\n<h2 id=\"e.-informatif-dan-menarik\">E. Informatif dan Menarik<\/h2>\n<p>Artikel ilmiah populer bertujuan menambah pengetahuan. Penulis dapat menggunakan pertanyaan, ilustrasi, perbandingan, analogi, atau contoh nyata agar pembaca tertarik.<\/p>\n<p>Contoh pembuka: “Pernahkah kamu bertanya mengapa halaman sekolah yang dipenuhi pohon terasa lebih nyaman dibandingkan halaman yang seluruh permukaannya berupa beton?”<\/p>\n<h2 id=\"f.-memiliki-sumber-informasi-yang-dapat-dipertanggungjawabkan\">F. Memiliki Sumber Informasi yang Dapat Dipertanggungjawabkan<\/h2>\n<p>Informasi harus diperiksa kebenarannya. Penulis perlu memilih sumber yang relevan, seperti buku pelajaran, artikel ilmiah, lembaga pendidikan, atau lembaga resmi yang memiliki keahlian dalam bidang terkait. Hindari menyalin tulisan orang lain tanpa mencantumkan sumber.<\/p>\n<h2 id=\"g.-tidak-selalu-berbentuk-laporan-penelitian-formal\">G. Tidak Selalu Berbentuk Laporan Penelitian Formal<\/h2>\n<p>Artikel ilmiah populer dapat menggunakan gaya penulisan yang lebih luwes daripada laporan penelitian akademik. Tulisan dapat diawali dengan cerita singkat, pengalaman pengamatan, pertanyaan, atau fenomena menarik. Namun, gaya bahasa yang santai tidak boleh mengubah fakta.<\/p>\n<h2 id=\"h.-contoh-analisis-ciri-ciri\">H. Contoh Analisis Ciri-Ciri<\/h2>\n<p>“Berdasarkan pengamatan selama lima hari, tempat sampah di dekat kantin lebih cepat penuh dibandingkan tempat sampah di ruang kelas. Kondisi ini menunjukkan bahwa aktivitas di sekitar kantin menghasilkan banyak sampah. Sekolah dapat melakukan pengamatan lanjutan untuk mengetahui jenis sampah yang paling banyak ditemukan.”<\/p>\n<p>Ciri-ciri yang tampak: berdasarkan pengamatan; menggunakan bahasa yang mudah dipahami; membahas fenomena di sekolah; menyampaikan kesimpulan secara hati-hati; dan mengusulkan pengamatan lanjutan.<\/p>\n<h2 id=\"i.-aktivitas-interaktif\">I. Aktivitas Interaktif<\/h2>\n<p>Pertanyaan: Pilih pernyataan yang menunjukkan ciri artikel ilmiah populer.<\/p>\n<p>A. Menggunakan istilah rumit sebanyak mungkin tanpa penjelasan.<\/p>\n<p>B. Menyampaikan informasi yang menarik, mudah dipahami, dan didukung bukti.<\/p>\n<p>C. Mengutamakan pendapat pribadi meskipun bertentangan dengan data.<\/p>\n<details><summary>Lihat kunci jawaban<\/summary><p> B. Artikel ilmiah populer harus komunikatif dan tetap dapat dipertanggungjawabkan.<\/p><\/details>\n", "soal": [{"q": "Artikel ilmiah populer menyampaikan informasi berdasarkan hal-hal berikut, <b>kecuali<\/b>...", "o": ["Fakta", "Dugaan tanpa dasar", "Hasil pengamatan", "Sumber tepercaya"], "a": 1}, {"q": "Penulis artikel ilmiah populer tidak boleh membuat klaim seolah-olah benar jika...", "o": ["Tanpa dasar yang jelas", "Menggunakan bahasa sehari-hari", "Topiknya tentang lingkungan", "Ditujukan untuk anak sekolah"], "a": 0}, {"q": "Mengapa penulis artikel ilmiah populer harus menggunakan bahasa yang mudah dipahami?", "o": ["Karena tulisan tersebut ditujukan untuk para ahli", "Karena tulisan tersebut ditujukan kepada masyarakat umum", "Agar tulisannya terlihat sangat akademis", "Agar tulisannya bisa dijadikan jurnal internasional"], "a": 1}, {"q": "Jika penulis menggunakan istilah ilmiah dalam artikel populer, hal yang sebaiknya dilakukan adalah...", "o": ["Menggantinya dengan bahasa asing", "Menghapus istilah tersebut", "Menjelaskan istilah tersebut agar pembaca memahaminya", "Membiarkannya agar pembaca mencari tahu sendiri"], "a": 2}, {"q": "Berikut ini adalah contoh topik yang dekat dengan kehidupan sehari-hari, <b>kecuali<\/b>...", "o": ["Mengapa sampah plastik sulit terurai?", "Dampak radiasi kosmik pada struktur atom di galaksi Andromeda", "Bagaimana kebiasaan tidur memengaruhi konsentrasi belajar?", "Mengapa genangan air menjadi tempat berkembang biak nyamuk?"], "a": 1}, {"q": "Artikel ilmiah populer harus disusun secara logis dan sistematis. Urutan yang paling masuk akal adalah...", "o": ["Pembahasan - Penutup - Pembuka", "Penutup - Pembuka - Pembahasan", "Pembuka - Pembahasan - Penutup", "Pembahasan - Pembuka - Penutup"], "a": 2}, {"q": "Pada bagian pembuka artikel ilmiah populer, penulis biasanya...", "o": ["Menyampaikan kesimpulan", "Memperkenalkan masalah", "Menjelaskan penyebab secara detail", "Memberikan saran atau solusi"], "a": 1}, {"q": "Untuk membuat artikel menjadi informatif dan menarik, penulis dapat menggunakan hal-hal berikut, <b>kecuali<\/b>...", "o": ["Pertanyaan", "Analogi", "Istilah teknis yang berlebihan", "Ilustrasi"], "a": 2}, {"q": "Contoh kalimat pembuka yang bertujuan menarik minat pembaca adalah...", "o": ["Sampah plastik adalah masalah.", "Pernahkah kamu bertanya mengapa halaman sekolah terasa panas?", "Suhu udara hari ini 30 derajat Celcius.", "Oleh karena itu, kita harus menanam pohon."], "a": 1}, {"q": "Informasi dalam artikel harus memiliki sumber yang dapat dipertanggungjawabkan. Sumber yang relevan antara lain...", "o": ["Pesan berantai dari grup obrolan yang tidak jelas asalnya", "Buku pelajaran dan lembaga resmi", "Mitos masyarakat setempat", "Pendapat selebritas tanpa keahlian di bidang tersebut"], "a": 1}, {"q": "Menyalin tulisan orang lain tanpa mencantumkan sumbernya merupakan tindakan yang...", "o": ["Diperbolehkan agar artikel cepat selesai", "Dianjurkan dalam artikel ilmiah populer", "Harus dihindari karena melanggar etika penulisan", "Menjadi ciri khas karya ilmiah akademik"], "a": 2}, {"q": "Berbeda dengan laporan penelitian formal, gaya penulisan artikel ilmiah populer lebih...", "o": ["Luwes dan santai", "Kaku dan baku", "Penuh tabel dan grafik rumit", "Singkat dan tanpa penjelasan"], "a": 0}, {"q": "Meskipun menggunakan gaya bahasa yang santai, artikel ilmiah populer <b>tidak boleh<\/b> mengubah...", "o": ["Struktur kalimat", "Fakta", "Judul tulisan", "Topik bahasan"], "a": 1}, {"q": "\"Berdasarkan pengamatan selama lima hari, tempat sampah di dekat kantin lebih cepat penuh.\" Kutipan tersebut menunjukkan ciri artikel ilmiah populer, yaitu...", "o": ["Menggunakan majas", "Mengusulkan pengamatan lanjutan", "Berdasarkan pengamatan nyata", "Menggunakan istilah rumit"], "a": 2}, {"q": "Pernyataan manakah yang paling tepat menggambarkan ciri artikel ilmiah populer?", "o": ["Menyampaikan informasi menarik yang didukung bukti.", "Menggunakan istilah rumit sebanyak mungkin.", "Mengutamakan pendapat pribadi di atas data.", "Selalu menggunakan format laporan penelitian resmi."], "a": 0}]}, {"no": 3, "title": "Mengidentifikasi Fakta dan Opini", "short": "Fakta & Opini", "html": "<h2 id=\"a.-pengertian-fakta\">A. Pengertian Fakta<\/h2>\n<p>Fakta adalah informasi atau pernyataan yang dapat diperiksa kebenarannya melalui bukti, data, pengamatan, dokumen, atau sumber yang dapat dipercaya. Fakta tidak selalu berupa angka; pernyataan tentang kejadian atau kondisi nyata juga dapat menjadi fakta jika dapat diverifikasi.<\/p>\n<p>Indonesia memiliki wilayah daratan dan perairan.<\/p>\n<p>Dalam pengamatan kelas selama lima hari, ditemukan 35 bungkus plastik di sekitar kantin.<\/p>\n<p>Air membeku pada suhu sekitar 0°C pada tekanan 1 atmosfer.<\/p>\n<p>Angka pada contoh pengamatan merupakan fakta apabila benar-benar diperoleh dari pengamatan dan pencatatan.<\/p>\n<h2 id=\"b.-pengertian-opini\">B. Pengertian Opini<\/h2>\n<p>Opini adalah pendapat, penilaian, dugaan, atau pandangan seseorang terhadap suatu hal. Opini dapat didasarkan pada fakta, tetapi mengandung unsur penilaian atau pandangan.<\/p>\n<p>Menurut saya, halaman sekolah akan lebih nyaman jika ditanami lebih banyak pohon.<\/p>\n<p>Membaca buku sains merupakan kegiatan yang sangat menyenangkan.<\/p>\n<p>Program pengurangan sampah sebaiknya menjadi prioritas sekolah.<\/p>\n<h2 id=\"c.-perbedaan-fakta-dan-opini\">C. Perbedaan Fakta dan Opini<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspek<\/strong><\/th>\n<th><strong>Fakta<\/strong><\/th>\n<th><strong>Opini<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Isi<\/td>\n<td>Informasi yang dapat diverifikasi<\/td>\n<td>Pendapat atau penilaian<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Dasar<\/td>\n<td>Bukti, data, pengamatan, atau dokumen<\/td>\n<td>Pandangan, penafsiran, atau pertimbangan<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pengujian<\/td>\n<td>Diperiksa melalui bukti yang relevan<\/td>\n<td>Dinilai sebagai pendapat; alasan dan buktinya dapat diperiksa<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Contoh<\/td>\n<td>Suhu ruangan tercatat 30°C.<\/td>\n<td>Ruangan itu terasa sangat panas.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Kata seperti menurut saya, sebaiknya, paling bagus, dan sangat menarik sering menandai opini. Namun, penentuan fakta atau opini harus memperhatikan isi dan konteks pernyataan.<\/p>\n<h2 id=\"d.-fakta-dan-opini-dalam-satu-artikel\">D. Fakta dan Opini dalam Satu Artikel<\/h2>\n<p><strong>Judul:<\/strong> Mengurangi Sampah Plastik di Sekolah<\/p>\n<p>“Berdasarkan pencatatan kelas selama satu minggu, siswa menemukan 70 bungkus plastik di sekitar kantin. Sampah tersebut ditemukan setelah jam istirahat. Menurut saya, sekolah sebaiknya menyediakan lebih banyak tempat sampah terpilah agar siswa lebih mudah memisahkan sampah.”<\/p>\n<p>Fakta: pencatatan kelas menemukan 70 bungkus plastik selama satu minggu, jika data tersebut benar-benar tercatat.<\/p>\n<p>Fakta: sampah ditemukan setelah jam istirahat, jika sesuai dengan catatan pengamatan.<\/p>\n<p>Opini: sekolah sebaiknya menyediakan lebih banyak tempat sampah terpilah.<\/p>\n<h2 id=\"e.-cara-mengidentifikasi-fakta-dan-opini\">E. Cara Mengidentifikasi Fakta dan Opini<\/h2>\n<p>Baca pernyataan dengan teliti dan pahami hal yang dibicarakan.<\/p>\n<p>Periksa apakah pernyataan dapat dibuktikan melalui data, dokumen, atau pengamatan.<\/p>\n<p>Perhatikan unsur penilaian, saran, perasaan, atau pandangan pribadi.<\/p>\n<p>Periksa konteks dan sumber. Angka yang terdengar meyakinkan belum tentu benar jika tidak memiliki bukti.<\/p>\n<p>Pisahkan data dari kesimpulan. Data pengamatan dapat menjadi fakta, sedangkan penafsirannya dapat mengandung opini.<\/p>\n<h2 id=\"f.-latihan\">F. Latihan<\/h2>\n<p>Tentukan apakah pernyataan berikut termasuk fakta atau opini.<\/p>\n<ol type=\"1\">\n<li><p>“Dalam pengamatan hari Senin, terdapat 12 tanaman di taman sekolah.”<\/p><\/li>\n<li><p>“Taman sekolah adalah tempat paling indah di desa.”<\/p><\/li>\n<li><p>“Sekolah sebaiknya mengurangi penggunaan plastik sekali pakai.”<\/p><\/li>\n<\/ol>\n<details><summary>Lihat kunci jawaban<\/summary><p> 1. Fakta, jika sesuai catatan pengamatan. 2. Opini, karena mengandung penilaian. 3. Opini, karena berupa saran.<\/p><\/details>\n", "soal": [{"q": "Informasi atau pernyataan yang dapat diperiksa kebenarannya melalui bukti, data, atau pengamatan disebut...", "o": ["Opini", "Argumen", "Fakta", "Saran"], "a": 2}, {"q": "Pendapat, penilaian, atau dugaan seseorang terhadap suatu hal disebut...", "o": ["Fakta", "Opini", "Bukti", "Data"], "a": 1}, {"q": "Fakta tidak selalu berupa angka. Pernyataan tentang kondisi nyata juga bisa disebut fakta asalkan...", "o": ["Disetujui oleh banyak orang", "Dapat diverifikasi kebenarannya", "Ditulis oleh penulis terkenal", "Menggunakan bahasa formal"], "a": 1}, {"q": "Manakah dari pernyataan berikut yang merupakan sebuah fakta?", "o": ["Menurut saya, udara pagi ini sangat sejuk.", "Membaca buku sains sangat membosankan.", "Air membeku pada suhu sekitar 0°C pada tekanan 1 atmosfer.", "Sekolah kita adalah sekolah yang paling indah."], "a": 2}, {"q": "\"Menurut saya, halaman sekolah akan lebih nyaman jika ditanami lebih banyak pohon.\" Kalimat tersebut termasuk ke dalam...", "o": ["Fakta", "Data pengamatan", "Opini", "Kesimpulan ilmiah"], "a": 2}, {"q": "Salah satu ciri dari kalimat opini adalah sering menggunakan kata-kata berikut, <b>kecuali<\/b>...", "o": ["Menurut saya", "Sebaiknya", "Sangat menarik", "Berdasarkan pencatatan"], "a": 3}, {"q": "Perbedaan fakta dan opini berdasarkan cara pengujiannya adalah...", "o": ["Fakta diperiksa melalui bukti, opini dinilai sebagai pendapat", "Fakta dinilai sebagai pendapat, opini diperiksa melalui dokumen", "Keduanya sama-sama tidak dapat diuji", "Keduanya harus diuji menggunakan alat laboratorium"], "a": 0}, {"q": "\"Suhu ruangan tercatat 30°C.\" Pernyataan tersebut adalah...", "o": ["Opini", "Fakta", "Penilaian", "Pandangan pribadi"], "a": 1}, {"q": "\"Ruangan itu terasa sangat panas.\" Pernyataan tersebut adalah...", "o": ["Fakta", "Opini", "Data", "Bukti nyata"], "a": 1}, {"q": "Cara yang tepat untuk mengidentifikasi fakta dalam suatu artikel adalah dengan memeriksa apakah pernyataan tersebut...", "o": ["Mengandung saran", "Mengungkapkan perasaan penulis", "Dapat dibuktikan melalui data atau dokumen", "Memiliki kata \"sebaiknya\""], "a": 2}, {"q": "“Dalam pengamatan hari Senin, terdapat 12 tanaman di taman sekolah.” Jika hal ini benar-benar tercatat, maka kalimat tersebut adalah...", "o": ["Fakta", "Opini", "Dugaan", "Saran"], "a": 0}, {"q": "\"Taman sekolah adalah tempat paling indah di desa.\" Kalimat ini termasuk opini karena...", "o": ["Mengandung angka", "Mengandung unsur penilaian yang bersifat subjektif", "Berdasarkan pengamatan hari Senin", "Ditulis dalam artikel ilmiah"], "a": 1}, {"q": "\"Program pengurangan sampah sebaiknya menjadi prioritas sekolah.\" Kalimat ini termasuk opini karena berisi...", "o": ["Bukti tertulis", "Data lapangan", "Sebuah saran", "Hasil observasi"], "a": 2}, {"q": "Pemisahan antara fakta dan opini dalam membaca artikel penting agar pembaca dapat membedakan antara...", "o": ["Judul dan penutup", "Data aktual dan penafsiran/penilaian penulis", "Sinonim dan antonim", "Observasi dan wawancara"], "a": 1}, {"q": "Angka yang terdengar meyakinkan dalam sebuah kalimat...", "o": ["Pasti merupakan fakta yang benar", "Belum tentu benar jika tidak memiliki bukti atau konteks yang jelas", "Selalu merupakan opini penulis", "Tidak boleh digunakan dalam artikel ilmiah populer"], "a": 1}]}, {"no": 4, "title": "Cara Mengumpulkan Data dalam Menulis Artikel", "short": "Data", "html": "<h2 id=\"a.-pengertian-pengumpulan-data\">A. Pengertian Pengumpulan Data<\/h2>\n<p>Pengumpulan data adalah kegiatan memperoleh informasi yang diperlukan untuk menjelaskan suatu topik atau menjawab pertanyaan tertentu. Data menjadi dasar penjelasan sehingga penulis tidak hanya menyampaikan dugaan.<\/p>\n<p>Contoh: untuk menulis artikel “Mengapa Sampah Menumpuk di Kantin Sekolah?”, penulis dapat mengumpulkan informasi tentang jenis dan jumlah sampah, waktu penumpukan, serta kebiasaan membuang sampah.<\/p>\n<h2 id=\"b.-menentukan-topik-dan-pertanyaan\">B. Menentukan Topik dan Pertanyaan<\/h2>\n<p>Pilih topik yang jelas dan batasi pembahasannya. Topik yang terlalu luas akan menyulitkan pengumpulan data.<\/p>\n<p>Contoh topik yang lebih terarah: “Jenis sampah yang paling banyak ditemukan di kantin sekolah selama lima hari.”<\/p>\n<p>Pertanyaan yang dapat diajukan:<\/p>\n<p>Jenis sampah apa yang paling banyak ditemukan?<\/p>\n<p>Di lokasi mana sampah paling sering menumpuk?<\/p>\n<p>Pada waktu kapan sampah paling banyak ditemukan?<\/p>\n<p>Apa kemungkinan penyebabnya berdasarkan hasil pengamatan?<\/p>\n<h2 id=\"c.-teknik-mengumpulkan-data\">C. Teknik Mengumpulkan Data<\/h2>\n<h3 id=\"observasi-atau-pengamatan\">1. Observasi atau Pengamatan<\/h3>\n<p>Observasi adalah kegiatan mengamati objek, keadaan, atau peristiwa secara langsung dan mencatat hasilnya. Contoh: mengamati jumlah sampah di kantin setiap hari setelah jam istirahat. Pengamatan perlu dilakukan secara konsisten dan tidak boleh mencatat sesuatu yang tidak benar-benar terlihat.<\/p>\n<h3 id=\"wawancara\">2. Wawancara<\/h3>\n<p>Wawancara adalah kegiatan memperoleh informasi melalui pertanyaan kepada orang yang memiliki pengalaman atau pengetahuan tentang topik tertentu. Pertanyaan harus jelas, sopan, dan tidak menggiring narasumber.<\/p>\n<p>Sampah jenis apa yang paling sering Bapak/Ibu temukan?<\/p>\n<p>Kapan sampah biasanya paling banyak terkumpul?<\/p>\n<p>Apa kendala yang dihadapi saat menjaga kebersihan kantin?<\/p>\n<h3 id=\"studi-pustaka\">3. Studi Pustaka<\/h3>\n<p>Studi pustaka adalah kegiatan mencari informasi dari buku, jurnal, artikel ilmiah, laporan, atau sumber tertulis lainnya. Periksa nama penulis atau lembaga, tanggal penerbitan, relevansi informasi, dan bukti yang digunakan.<\/p>\n<h3 id=\"angket-atau-kuesioner\">4. Angket atau Kuesioner<\/h3>\n<p>Angket adalah kumpulan pertanyaan tertulis yang diberikan kepada sejumlah responden untuk memperoleh informasi tentang kebiasaan, pengalaman, atau pendapat mereka. Contoh: memberikan angket kepada 30 siswa untuk mengetahui berapa banyak yang membawa botol minum sendiri. Hasil dari 30 siswa tidak otomatis mewakili seluruh siswa di Indonesia.<\/p>\n<h3 id=\"dokumentasi\">5. Dokumentasi<\/h3>\n<p>Dokumentasi adalah pengumpulan informasi melalui catatan, foto, tabel, laporan, atau dokumen lain yang relevan. Foto dapat menunjukkan keadaan pada saat tertentu, tetapi tidak selalu membuktikan penyebab suatu masalah.<\/p>\n<h2 id=\"d.-perbandingan-teknik-pengumpulan-data\">D. Perbandingan Teknik Pengumpulan Data<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Teknik<\/strong><\/th>\n<th><strong>Tujuan<\/strong><\/th>\n<th><strong>Contoh<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Observasi<\/td>\n<td>Mengetahui keadaan secara langsung<\/td>\n<td>Menghitung jumlah sampah<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Wawancara<\/td>\n<td>Memperoleh penjelasan narasumber<\/td>\n<td>Bertanya kepada petugas kebersihan<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Studi pustaka<\/td>\n<td>Memperoleh pengetahuan dari sumber tertulis<\/td>\n<td>Membaca laporan lingkungan<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Angket<\/td>\n<td>Mengumpulkan jawaban dari banyak responden<\/td>\n<td>Survei kebiasaan membawa botol minum<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Dokumentasi<\/td>\n<td>Menyimpan bukti atau catatan<\/td>\n<td>Foto, tabel, dan laporan pengamatan<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Penulis dapat menggabungkan beberapa teknik agar memperoleh gambaran yang lebih lengkap. Misalnya, hasil observasi dibandingkan dengan wawancara dan sumber bacaan.<\/p>\n<h2 id=\"e.-mengolah-dan-mencatat-data\">E. Mengolah dan Mencatat Data<\/h2>\n<p>Setelah data dikumpulkan, rapikan catatan dan pilih informasi yang berhubungan dengan topik.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Hari<\/strong><\/th>\n<th><strong>Bungkus plastik<\/strong><\/th>\n<th><strong>Botol plastik<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Senin<\/td>\n<td>12<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Selasa<\/td>\n<td>15<\/td>\n<td>5<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rabu<\/td>\n<td>13<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Jumlah<\/td>\n<td>40<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Dari tabel tersebut, bungkus plastik merupakan jenis sampah yang lebih banyak ditemukan selama tiga hari pengamatan. Namun, data tiga hari belum cukup untuk menyimpulkan pola sampah sepanjang tahun.<\/p>\n<h2 id=\"f.-etika-pengumpulan-data\">F. Etika Pengumpulan Data<\/h2>\n<p>Mencatat hasil pengamatan dengan jujur.<\/p>\n<p>Tidak mengubah angka agar mendukung kesimpulan yang diinginkan.<\/p>\n<p>Meminta izin sebelum mewawancarai atau memotret orang jika diperlukan.<\/p>\n<p>Tidak menyebarkan informasi pribadi tanpa izin.<\/p>\n<p>Mencantumkan sumber bacaan yang digunakan.<\/p>\n<p>Membedakan hasil pengamatan, keterangan narasumber, dan kesimpulan pribadi.<\/p>\n<h2 id=\"g.-latihan\">G. Latihan<\/h2>\n<p>Kamu ingin mengetahui kebiasaan siswa membawa botol minum sendiri. Metode apa yang paling sesuai untuk mengumpulkan jawaban dari banyak siswa?<\/p>\n<p>A. Angket atau kuesioner<\/p>\n<p>B. Hanya mengambil foto halaman sekolah<\/p>\n<p>C. Membaca cerita fiksi<\/p>\n<details><summary>Lihat kunci jawaban<\/summary><p> A. Angket membantu mengumpulkan jawaban dari banyak siswa dengan pertanyaan yang sama.<\/p><\/details>\n", "soal": [{"q": "Kegiatan memperoleh informasi yang diperlukan untuk menjelaskan suatu topik disebut...", "o": ["Mengarang bebas", "Menulis draf", "Pengumpulan data", "Membuat kerangka"], "a": 2}, {"q": "Sebelum mengumpulkan data, hal yang penting dilakukan agar pembahasan tidak melebar adalah...", "o": ["Memilih dan membatasi topik", "Membuat judul yang panjang", "Mewawancarai semua orang di sekolah", "Menyebarkan angket tanpa tujuan"], "a": 0}, {"q": "Kegiatan mengamati objek, keadaan, atau peristiwa secara langsung dan mencatat hasilnya disebut...", "o": ["Wawancara", "Studi Pustaka", "Observasi", "Angket"], "a": 2}, {"q": "Saat melakukan observasi, pengamat <b>tidak boleh<\/b> melakukan hal berikut...", "o": ["Mencatat jumlah objek yang diamati", "Mencatat sesuatu yang tidak benar-benar terlihat", "Melakukan pengamatan secara konsisten", "Memperhatikan keadaan secara langsung"], "a": 1}, {"q": "Memperoleh informasi melalui pertanyaan kepada orang yang memiliki pengalaman atau pengetahuan tentang topik tertentu dinamakan...", "o": ["Wawancara", "Dokumentasi", "Observasi", "Studi Pustaka"], "a": 0}, {"q": "Pertanyaan dalam wawancara yang baik harus memiliki kriteria berikut, <b>kecuali<\/b>...", "o": ["Jelas", "Sopan", "Menggiring narasumber ke jawaban tertentu", "Berhubungan dengan topik"], "a": 2}, {"q": "Mencari informasi dari buku, jurnal, laporan, atau sumber tertulis lainnya adalah teknik pengumpulan data yang disebut...", "o": ["Wawancara", "Studi pustaka", "Angket", "Observasi"], "a": 1}, {"q": "Kumpulan pertanyaan tertulis yang diberikan kepada sejumlah responden untuk memperoleh informasi disebut...", "o": ["Dokumentasi", "Observasi", "Angket atau kuesioner", "Studi pustaka"], "a": 2}, {"q": "Hasil dari angket yang disebarkan kepada 30 siswa di satu sekolah...", "o": ["Otomatis mewakili seluruh siswa di Indonesia", "Hanya mewakili responden di sekolah tersebut", "Merupakan data mutlak yang tidak bisa disangkal", "Pasti salah dan tidak bisa digunakan"], "a": 1}, {"q": "Pengumpulan informasi melalui catatan, foto, tabel, laporan, atau dokumen relevan lainnya disebut...", "o": ["Angket", "Wawancara", "Dokumentasi", "Studi pustaka"], "a": 2}, {"q": "Jika kamu ingin mengetahui kebiasaan siswa satu sekolah membawa botol minum sendiri, teknik pengumpulan data yang paling efisien adalah...", "o": ["Mengamati semua siswa satu per satu", "Wawancara satu per satu ke seluruh siswa", "Menyebarkan angket/kuesioner kepada siswa", "Membaca buku fiksi tentang botol minum"], "a": 2}, {"q": "Berikut ini merupakan etika dalam pengumpulan data, <b>kecuali<\/b>...", "o": ["Mencatat hasil pengamatan dengan jujur", "Mengubah angka agar mendukung kesimpulan penulis", "Meminta izin sebelum mewawancarai narasumber", "Tidak menyebarkan informasi pribadi tanpa izin"], "a": 1}, {"q": "Jika hasil pengamatan selama 3 hari menunjukkan sampah plastik paling banyak di kantin, kesimpulan yang etis adalah...", "o": ["Menyatakan bahwa sampah plastik pasti selalu paling banyak sepanjang tahun", "Menyatakan bahwa sampah plastik paling banyak selama 3 hari pengamatan tersebut", "Memanipulasi data agar jenis sampah lain yang terlihat paling banyak", "Menyalahkan petugas kebersihan kantin"], "a": 1}, {"q": "Foto merupakan bagian dari dokumentasi. Kelemahan foto sebagai bukti tunggal adalah...", "o": ["Foto selalu menunjukkan fakta yang tidak bisa dibantah", "Foto menunjukkan keadaan saat itu, tetapi tidak selalu membuktikan penyebab masalah", "Foto lebih akurat daripada tabel data", "Foto tidak bisa digunakan dalam artikel ilmiah populer"], "a": 1}, {"q": "Mengapa penulis sebaiknya menggabungkan beberapa teknik pengumpulan data?", "o": ["Agar tugasnya menjadi sangat sulit", "Agar memperoleh gambaran informasi yang lebih lengkap dan kuat", "Karena satu metode pengumpulan data selalu salah", "Agar artikel yang dihasilkan menjadi sangat tebal"], "a": 1}]}, {"no": 5, "title": "Kalimat Perbandingan, Analogi, Sinonim, dan Antonim", "short": "Kebahasaan", "html": "<p>Empat unsur kebahasaan ini membantu penulis menjelaskan informasi dengan lebih jelas, menarik, dan mudah dipahami pembaca.<\/p>\n<h2 id=\"a.-kalimat-perbandingan\">A. Kalimat Perbandingan<\/h2>\n<p>Kalimat perbandingan adalah kalimat yang membandingkan dua hal atau lebih untuk menunjukkan persamaan, perbedaan, atau tingkat suatu sifat.<\/p>\n<p>Kata atau ungkapan yang sering digunakan antara lain: lebih … daripada …, kurang … daripada …, sama … dengan …, berbeda dengan …, dibandingkan dengan …, dan sedangkan.<\/p>\n<p>Contoh:<\/p>\n<p>Halaman yang ditumbuhi pohon terasa lebih teduh daripada halaman tanpa pohon.<\/p>\n<p>Sampah organik berbeda dengan sampah anorganik dalam sifat dan cara penguraiannya.<\/p>\n<p>Jumlah botol plastik pada hari Senin sama dengan jumlahnya pada hari Selasa.<\/p>\n<p>Kalimat perbandingan membantu penulis menjelaskan perubahan, menunjukkan perbedaan hasil pengamatan, atau membuat informasi lebih mudah dibayangkan. Klaim tentang hasil pengamatan perlu didukung data.<\/p>\n<h2 id=\"b.-analogi\">B. Analogi<\/h2>\n<p>Analogi adalah cara menjelaskan suatu konsep dengan membandingkannya dengan hal lain yang memiliki kemiripan tertentu. Analogi membantu pembaca memahami konsep yang abstrak atau sulit dibayangkan.<\/p>\n<p>Contoh 1: “Akar pohon dapat dianalogikan seperti fondasi bangunan. Keduanya membantu menopang sesuatu, meskipun cara kerja dan sifatnya berbeda.”<\/p>\n<p>Contoh 2: “Jantung dapat dianalogikan seperti pompa yang membantu mengalirkan darah ke seluruh tubuh.”<\/p>\n<p>Analogi tidak berarti dua hal yang dibandingkan benar-benar sama dalam semua aspek.<\/p>\n<h2 id=\"c.-perbedaan-analogi-dan-perbandingan\">C. Perbedaan Analogi dan Perbandingan<\/h2>\n<p>Perbandingan dapat menunjukkan persamaan atau perbedaan dua hal secara langsung. Analogi lebih menekankan kemiripan hubungan atau cara kerja untuk membantu menjelaskan konsep.<\/p>\n<p>Perbandingan: “Akar pohon lebih bercabang daripada batang utamanya.”<\/p>\n<p>Analogi: “Akar pohon menyerupai fondasi yang membantu menopang bangunan.”<\/p>\n<h2 id=\"d.-sinonim\">D. Sinonim<\/h2>\n<p>Sinonim adalah kata yang memiliki makna sama atau hampir sama dengan kata lain. Sinonim dapat membantu penulis menghindari pengulangan dan membuat kalimat lebih bervariasi.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Kata<\/strong><\/th>\n<th><strong>Sinonim atau kata yang maknanya berdekatan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Indah<\/td>\n<td>Elok<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cepat<\/td>\n<td>Lekas<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pandai<\/td>\n<td>Cerdas<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Dampak<\/td>\n<td>Pengaruh<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mengamati<\/td>\n<td>Memperhatikan<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Meneliti<\/td>\n<td>Mengkaji<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Sinonim tidak selalu dapat saling menggantikan dalam semua kalimat. Pemilihan kata tetap harus memperhatikan konteks dan maknanya.<\/p>\n<p>Contoh: “Para siswa mengamati pertumbuhan tanaman. Mereka memperhatikan perubahan tinggi tanaman setiap hari.”<\/p>\n<h2 id=\"e.-antonim\">E. Antonim<\/h2>\n<p>Antonim adalah kata yang memiliki makna berlawanan dengan kata lain. Antonim membantu penulis menjelaskan perbedaan keadaan atau sifat.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Kata<\/strong><\/th>\n<th><strong>Antonim<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Besar<\/td>\n<td>Kecil<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tinggi<\/td>\n<td>Rendah<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Panas<\/td>\n<td>Dingin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bersih<\/td>\n<td>Kotor<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cepat<\/td>\n<td>Lambat<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bertambah<\/td>\n<td>Berkurang<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Alami<\/td>\n<td>Buatan (dalam konteks tertentu)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"f.-menerapkan-keempat-unsur-kebahasaan\">F. Menerapkan Keempat Unsur Kebahasaan<\/h2>\n<p>“Halaman yang ditumbuhi pohon cenderung lebih teduh daripada halaman terbuka tanpa naungan. Akar pohon dapat dianalogikan seperti fondasi yang membantu menopang bangunan. Tumbuhan yang sehat memiliki pertumbuhan yang baik, sedangkan tumbuhan yang terganggu pertumbuhannya dapat menunjukkan kondisi yang kurang baik. Oleh karena itu, siswa perlu mengamati perkembangan tanaman secara cermat.”<\/p>\n<p>Perbandingan: “lebih teduh daripada”.<\/p>\n<p>Analogi: “Akar pohon dapat dianalogikan seperti fondasi”.<\/p>\n<p>Sinonim: mengamati dan memperhatikan dapat bermakna berdekatan sesuai konteks.<\/p>\n<p>Antonim: sehat dan terganggu menunjukkan kondisi yang berlawanan dalam konteks paragraf.<\/p>\n<h2 id=\"g.-latihan\">G. Latihan<\/h2>\n<ol type=\"1\">\n<li><p>“Halaman A lebih teduh daripada halaman B” termasuk: A. Kalimat perbandingan; B. Analogi; C. Antonim.<\/p><\/li>\n<li><p>Kata yang berlawanan makna dengan “meningkat” adalah: A. Bertambah; B. Berkurang; C. Naik.<\/p><\/li>\n<li><p>“Jantung bekerja seperti pompa yang mengalirkan darah” menggunakan: A. Analogi; B. Antonim; C. Sinonim.<\/p><\/li>\n<\/ol>\n<details><summary>Lihat kunci jawaban<\/summary><p> 1. A; 2. B; 3. A.<\/p><\/details>\n", "soal": [{"q": "Kalimat yang membandingkan dua hal atau lebih untuk menunjukkan persamaan, perbedaan, atau tingkat suatu sifat disebut...", "o": ["Kalimat analogi", "Kalimat perbandingan", "Kalimat perintah", "Kalimat tanya"], "a": 1}, {"q": "Kata atau ungkapan berikut sering digunakan dalam kalimat perbandingan, <b>kecuali<\/b>...", "o": ["Lebih ... daripada ...", "Sama ... dengan ...", "Seandainya ...", "Berbeda dengan ..."], "a": 2}, {"q": "\"Halaman yang ditumbuhi pohon terasa lebih teduh daripada halaman tanpa pohon.\" Kalimat ini merupakan contoh kalimat...", "o": ["Antonim", "Sinonim", "Analogi", "Perbandingan"], "a": 3}, {"q": "Cara menjelaskan suatu konsep dengan membandingkannya dengan hal lain yang memiliki kemiripan cara kerja atau fungsi disebut...", "o": ["Analogi", "Perbandingan", "Antonim", "Sinonim"], "a": 0}, {"q": "\"Jantung dapat dianalogikan seperti pompa yang membantu mengalirkan darah ke seluruh tubuh.\" Teks ini menggunakan...", "o": ["Antonim", "Analogi", "Sinonim", "Pertentangan"], "a": 1}, {"q": "Perbedaan utama antara perbandingan dan analogi adalah...", "o": ["Perbandingan menggunakan benda mati, analogi menggunakan makhluk hidup", "Perbandingan menunjuk persamaan/perbedaan langsung, analogi menekankan kemiripan fungsi untuk menjelaskan konsep abstrak", "Perbandingan menggunakan sinonim, analogi menggunakan antonim", "Tidak ada perbedaan sama sekali"], "a": 1}, {"q": "Kata yang memiliki makna sama atau hampir sama dengan kata lain disebut...", "o": ["Analogi", "Sinonim", "Antonim", "Akronim"], "a": 1}, {"q": "Tujuan penggunaan sinonim dalam menulis artikel adalah...", "o": ["Membuat kalimat menjadi sangat rumit", "Menghindari pengulangan kata dan membuat kalimat lebih bervariasi", "Menunjukkan makna yang saling berlawanan", "Menyamarkan fakta dari pembaca"], "a": 1}, {"q": "Sinonim dari kata \"Dampak\" yang paling tepat dalam konteks artikel ilmiah adalah...", "o": ["Pengaruh", "Penyebab", "Masalah", "Solusi"], "a": 0}, {"q": "\"Para siswa <i>mengamati<\/i> pertumbuhan tanaman. Mereka <i>memperhatikan<\/i> perubahan tinggi tanaman setiap hari.\" Kata bercetak miring tersebut merupakan contoh dari...", "o": ["Antonim", "Homonim", "Sinonim", "Analogi"], "a": 2}, {"q": "Kata yang memiliki makna berlawanan dengan kata lain disebut...", "o": ["Antonim", "Sinonim", "Perbandingan", "Analogi"], "a": 0}, {"q": "Pasangan kata di bawah ini yang merupakan antonim adalah...", "o": ["Cepat - Lekas", "Pandai - Cerdas", "Bertambah - Berkurang", "Indah - Elok"], "a": 2}, {"q": "\"Tumbuhan yang sehat memiliki pertumbuhan yang baik, sedangkan tumbuhan yang terganggu akan tumbuh kurang baik.\" Kata <i>sehat<\/i> dan <i>terganggu<\/i> dalam kalimat tersebut menunjukkan hubungan...", "o": ["Sinonim", "Antonim", "Analogi", "Homofon"], "a": 1}, {"q": "“Akar pohon menyerupai fondasi yang membantu menopang bangunan.” Majas yang digunakan pada kalimat tersebut adalah...", "o": ["Sinonim", "Antonim", "Kalimat perintah", "Analogi"], "a": 3}, {"q": "Jika kata dasar dari fenomena yang diamati adalah \"alami\", maka antonim yang tepat (dalam konteks asal bahan) adalah...", "o": ["Biasa", "Buatan", "Natural", "Murni"], "a": 1}]}, {"no": 6, "title": "Mencermati Langkah Penulisan Artikel Ilmiah Populer", "short": "Menulis", "html": "<h2 id=\"a.-pengertian-proses-penulisan\">A. Pengertian Proses Penulisan<\/h2>\n<p>Menulis artikel ilmiah populer bukan sekadar menggabungkan kalimat menjadi paragraf. Penulis perlu menentukan topik, mengumpulkan informasi, memeriksa data, menyusun kerangka, menulis draf, dan memperbaiki tulisan.<\/p>\n<h2 id=\"b.-enam-tahap-penulisan\">B. Enam Tahap Penulisan<\/h2>\n<p>Menentukan topik: memilih fenomena yang menarik dan dapat dijelaskan.<\/p>\n<p>Merumuskan pertanyaan: menentukan hal yang ingin diketahui pembaca.<\/p>\n<p>Mengumpulkan data: melakukan pengamatan, wawancara, atau studi pustaka.<\/p>\n<p>Menyusun kerangka: mengurutkan pembuka, pembahasan, dan penutup.<\/p>\n<p>Menulis draf: mengembangkan kerangka menjadi paragraf yang utuh.<\/p>\n<p>Menyunting dan memublikasikan: memeriksa isi, bahasa, sumber, dan tampilan akhir.<\/p>\n<h2 id=\"c.-langkah-1-menentukan-topik\">C. Langkah 1 — Menentukan Topik<\/h2>\n<p>Topik adalah pokok persoalan yang dibahas dalam artikel. Topik yang baik sebaiknya menarik, relevan dengan kehidupan pembaca, memiliki informasi yang dapat dikumpulkan, dan sesuai dengan waktu yang tersedia.<\/p>\n<p>Topik luas: “Tanaman”.<\/p>\n<p>Topik lebih spesifik: “Pengaruh perbedaan intensitas cahaya terhadap pertumbuhan tanaman kacang hijau”.<\/p>\n<p>Untuk tugas SMP, topik dapat dibuat lebih sederhana, misalnya mengamati pertumbuhan kacang hijau di tempat terang dan tempat teduh.<\/p>\n<h2 id=\"d.-langkah-2-merumuskan-pertanyaan\">D. Langkah 2 — Merumuskan Pertanyaan<\/h2>\n<p>Pertanyaan membantu penulis menentukan arah pembahasan dan jenis data yang harus dikumpulkan.<\/p>\n<p>Bagaimana pertumbuhan tanaman kacang hijau di tempat terang dan teduh?<\/p>\n<p>Apakah terdapat perbedaan tinggi tanaman setelah beberapa hari?<\/p>\n<p>Faktor apa saja yang mungkin memengaruhi hasil pengamatan?<\/p>\n<p>Pertanyaan harus dapat dijawab dengan data yang tersedia. Jangan menyimpulkan bahwa cahaya merupakan satu-satunya penyebab perbedaan jika faktor lain tidak dikendalikan.<\/p>\n<h2 id=\"e.-langkah-3-mengumpulkan-dan-memeriksa-data\">E. Langkah 3 — Mengumpulkan dan Memeriksa Data<\/h2>\n<p>Menyiapkan dua kelompok tanaman.<\/p>\n<p>Memberikan jumlah air yang sama.<\/p>\n<p>Mengamati tinggi tanaman setiap hari.<\/p>\n<p>Mencatat hasil dalam tabel.<\/p>\n<p>Membaca sumber tepercaya mengenai kebutuhan cahaya pada tumbuhan.<\/p>\n<p>Periksa kembali data. Pastikan angka sesuai catatan, sumber bacaan relevan, dan hasil pengamatan tidak dicampur dengan dugaan pribadi.<\/p>\n<h2 id=\"f.-langkah-4-menyusun-kerangka-artikel\">F. Langkah 4 — Menyusun Kerangka Artikel<\/h2>\n<h3 id=\"judul\">1. Judul<\/h3>\n<p>Judul menggambarkan topik secara jelas dan menarik. Contoh: “Cahaya dan Pertumbuhan Kacang Hijau: Apa yang Terjadi?”<\/p>\n<h3 id=\"pembuka\">2. Pembuka<\/h3>\n<p>Pembuka memperkenalkan topik dan menarik minat pembaca. Contoh: “Pernahkah kamu memperhatikan bahwa tanaman yang diletakkan di tempat berbeda dapat menunjukkan bentuk pertumbuhan yang berbeda? Untuk memahami hal ini, kita dapat melakukan pengamatan sederhana terhadap tanaman kacang hijau.”<\/p>\n<h3 id=\"isi-atau-pembahasan\">3. Isi atau Pembahasan<\/h3>\n<p>Bagian isi menjelaskan informasi utama, data, proses, penyebab yang mungkin, dan hasil pengamatan. Jika data belum tersedia, penulis tidak boleh mengarang hasil pengamatan.<\/p>\n<h3 id=\"penutup\">4. Penutup<\/h3>\n<p>Penutup berisi simpulan berdasarkan informasi yang dibahas. Penulis dapat menambahkan saran yang sesuai. Contoh: “Pengamatan sederhana membantu kita memahami bahwa kondisi lingkungan dapat berkaitan dengan pertumbuhan tanaman. Pengamatan lanjutan dengan pengendalian faktor lain diperlukan untuk memperoleh kesimpulan yang lebih kuat.”<\/p>\n<h2 id=\"g.-langkah-5-mengembangkan-kerangka-menjadi-draf\">G. Langkah 5 — Mengembangkan Kerangka Menjadi Draf<\/h2>\n<p>Setiap paragraf memiliki satu gagasan utama.<\/p>\n<p>Kalimat tersusun secara logis.<\/p>\n<p>Istilah ilmiah dijelaskan jika diperlukan.<\/p>\n<p>Data digunakan untuk mendukung penjelasan.<\/p>\n<p>Fakta dibedakan dari opini.<\/p>\n<p>Perbandingan dan analogi digunakan secara tepat.<\/p>\n<p>Sumber informasi dicatat.<\/p>\n<p>Draf adalah tulisan awal yang masih dapat diperbaiki setelah selesai ditulis.<\/p>\n<h2 id=\"h.-langkah-6-menyunting-dan-memeriksa-artikel\">H. Langkah 6 — Menyunting dan Memeriksa Artikel<\/h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Aspek<\/strong><\/th>\n<th><strong>Hal yang diperiksa<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Isi<\/td>\n<td>Apakah informasi sesuai dengan topik?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Data<\/td>\n<td>Apakah angka dan fakta sesuai sumber?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Struktur<\/td>\n<td>Apakah pembuka, isi, dan penutup tersusun logis?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bahasa<\/td>\n<td>Apakah kalimat jelas dan mudah dipahami?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ejaan<\/td>\n<td>Apakah ejaan, tanda baca, dan huruf kapital tepat?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sumber<\/td>\n<td>Apakah sumber informasi dicatat dengan benar?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tampilan<\/td>\n<td>Apakah judul, paragraf, dan gambar mudah dibaca?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"i.-contoh-proyek-artikel-mini\">I. Contoh Proyek Artikel Mini<\/h2>\n<p>Topik: Kebersihan lingkungan sekolah.<\/p>\n<p>Judul: “Mengapa Kantin Sekolah Perlu Bebas Sampah?”<\/p>\n<p>Pertanyaan utama: Jenis sampah apa yang paling banyak ditemukan di kantin?<\/p>\n<p>Metode: Observasi selama lima hari dan pencatatan jenis sampah.<\/p>\n<p>Kerangka:<\/p>\n<p>Pembuka: kondisi kebersihan kantin.<\/p>\n<p>Isi: hasil pengamatan, jenis sampah, dan kemungkinan penyebabnya.<\/p>\n<p>Penutup: simpulan dan saran berdasarkan data.<\/p>\n<p>Produk akhir: artikel ilmiah populer sepanjang 3–5 paragraf dengan judul, isi yang runtut, serta sumber informasi yang relevan. Jumlah paragraf ini adalah contoh target tugas, bukan aturan baku.<\/p>\n<h2 id=\"j.-latihan\">J. Latihan<\/h2>\n<p>Manakah urutan penulisan yang paling tepat?<\/p>\n<p>A. Menulis draf → menentukan topik → memeriksa data → menyunting.<\/p>\n<p>B. Menentukan topik → mengumpulkan data → menyusun kerangka → menulis draf → menyunting.<\/p>\n<p>C. Menyunting → memublikasikan → menentukan topik → mengumpulkan data.<\/p>\n<details><summary>Lihat kunci jawaban<\/summary><p> B. Penulisan dilakukan bertahap dari perencanaan hingga penyuntingan.<\/p><\/details>\n", "soal": [{"q": "Langkah pertama yang harus dilakukan dalam menulis artikel ilmiah populer adalah...", "o": ["Menyusun kerangka", "Menulis draf", "Menentukan topik", "Menyunting tulisan"], "a": 2}, {"q": "Topik yang baik untuk artikel ilmiah populer sebaiknya memiliki kriteria berikut, <b>kecuali<\/b>...", "o": ["Menarik dan relevan", "Topiknya sangat luas dan tak terbatas", "Informasi dapat dikumpulkan", "Sesuai dengan waktu yang tersedia"], "a": 1}, {"q": "Setelah menentukan topik, langkah selanjutnya adalah merumuskan pertanyaan. Fungsi rumusan pertanyaan ini adalah...", "o": ["Membuat artikel terlihat panjang", "Menguji kecerdasan pembaca", "Menentukan arah pembahasan dan jenis data yang dikumpulkan", "Menjadi bagian penutup artikel"], "a": 2}, {"q": "Kegiatan melakukan pengamatan, wawancara, atau studi pustaka masuk ke dalam tahap...", "o": ["Mengumpulkan data", "Menyusun kerangka", "Menentukan topik", "Menyunting artikel"], "a": 0}, {"q": "Urutan umum dalam menyusun kerangka artikel yang benar adalah...", "o": ["Pembuka - Penutup - Pembahasan", "Pembahasan - Pembuka - Penutup", "Penutup - Pembahasan - Pembuka", "Pembuka - Pembahasan - Penutup"], "a": 3}, {"q": "Bagian dari kerangka artikel yang berfungsi memperkenalkan topik dan menarik minat pembaca adalah...", "o": ["Judul", "Pembuka", "Isi / Pembahasan", "Penutup"], "a": 1}, {"q": "Mengembangkan kerangka tulisan menjadi paragraf-paragraf yang utuh disebut kegiatan...", "o": ["Merumuskan masalah", "Mengumpulkan data", "Menulis draf", "Menyunting"], "a": 2}, {"q": "Tulisan awal yang belum sempurna dan masih dapat diperbaiki setelah selesai ditulis disebut...", "o": ["Teks final", "Kerangka", "Topik", "Draf"], "a": 3}, {"q": "Hal yang <b>tidak boleh<\/b> dilakukan saat menulis isi (pembahasan) jika data belum tersedia adalah...", "o": ["Mencari data tambahan melalui studi pustaka", "Mengarang hasil pengamatan sendiri agar tulisan cepat selesai", "Melakukan observasi lanjutan", "Menyusun pertanyaan baru untuk wawancara"], "a": 1}, {"q": "Kesimpulan berdasarkan informasi yang dibahas beserta saran diletakkan penulis pada bagian...", "o": ["Pembuka", "Isi", "Penutup", "Daftar pustaka"], "a": 2}, {"q": "Pada tahap menyunting (editing) tulisan, hal yang diperiksa dari aspek \"Ejaan\" meliputi...", "o": ["Kejelasan kalimat dan paragraf", "Ejaan, tanda baca, dan huruf kapital", "Kesesuaian fakta dengan data", "Keterbacaan gambar dan desain tampilan"], "a": 1}, {"q": "Manakah urutan penulisan artikel ilmiah populer yang paling tepat secara keseluruhan?", "o": ["Topik → Data → Pertanyaan → Kerangka → Menyunting → Draf", "Topik → Pertanyaan → Data → Kerangka → Draf → Menyunting", "Draf → Kerangka → Topik → Menyunting → Data", "Menyunting → Draf → Kerangka → Data → Topik"], "a": 1}, {"q": "Saat mengembangkan draf menjadi paragraf, penulis harus memastikan setiap paragraf memiliki berapa gagasan utama?", "o": ["Satu gagasan utama", "Tiga gagasan utama", "Tidak perlu gagasan utama", "Sebanyak mungkin gagasan"], "a": 0}, {"q": "Jika kamu ingin menulis artikel berjudul \"Mengapa Kantin Sekolah Perlu Bebas Sampah?\", data paling relevan yang harus kamu kumpulkan adalah...", "o": ["Tinggi badan siswa yang jajan di kantin", "Jenis dan jumlah sampah yang ditemukan di kantin", "Jumlah buku pelajaran di perpustakaan", "Merek cat dinding kantin"], "a": 1}, {"q": "Memeriksa kembali isi, bahasa, struktur, dan kebenaran sumber bacaan adalah kegiatan yang dilakukan pada tahap...", "o": ["Menentukan topik", "Mengumpulkan data", "Menulis kerangka", "Menyunting"], "a": 3}]}, {"no": 7, "title": "Jurnal Membaca", "short": "Jurnal", "html": "<h2 id=\"a.-pengertian-jurnal-membaca\">A. Pengertian Jurnal Membaca<\/h2>\n<p>Jurnal membaca adalah catatan yang dibuat pembaca untuk mendokumentasikan bacaan, informasi penting, pemahaman terhadap isi bacaan, serta tanggapan atau pertanyaan setelah membaca.<\/p>\n<p>Jurnal membaca bukan sekadar daftar judul buku. Melalui jurnal membaca, siswa belajar memahami teks, menemukan informasi penting, membedakan fakta dan opini, serta mengembangkan kemampuan menulis.<\/p>\n<h2 id=\"b.-tujuan-jurnal-membaca\">B. Tujuan Jurnal Membaca<\/h2>\n<p>Membangun kebiasaan membaca secara teratur.<\/p>\n<p>Meningkatkan pemahaman terhadap gagasan utama dan informasi pendukung.<\/p>\n<p>Melatih berpikir kritis dan memeriksa kualitas informasi.<\/p>\n<p>Memperkaya kosakata dan pemahaman istilah baru.<\/p>\n<p>Mendukung penulisan artikel melalui catatan fakta, data, dan sumber bacaan.<\/p>\n<h2 id=\"c.-unsur-unsur-jurnal-membaca\">C. Unsur-Unsur Jurnal Membaca<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Unsur<\/strong><\/th>\n<th><strong>Isi yang dicatat<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Tanggal membaca<\/td>\n<td>Hari atau tanggal kegiatan membaca<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Judul bacaan<\/td>\n<td>Judul buku, artikel, atau teks<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Penulis atau sumber<\/td>\n<td>Nama penulis, lembaga, atau penerbit<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Topik<\/td>\n<td>Pokok pembahasan bacaan<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ringkasan<\/td>\n<td>Inti informasi dalam beberapa kalimat<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Informasi penting<\/td>\n<td>Fakta, data, atau penjelasan utama<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Kosakata baru<\/td>\n<td>Kata yang belum dikenal beserta maknanya<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tanggapan<\/td>\n<td>Pendapat atau hal yang dipelajari setelah membaca<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pertanyaan<\/td>\n<td>Hal yang masih ingin diketahui<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kaitan dengan artikel<\/td>\n<td>Ide atau informasi yang dapat digunakan untuk menulis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Format jurnal dapat disesuaikan dengan tujuan pembelajaran dan kemampuan siswa.<\/p>\n<h2 id=\"d.-cara-mengisi-jurnal-membaca\">D. Cara Mengisi Jurnal Membaca<\/h2>\n<p>Memilih bacaan yang sesuai usia, minat, dan tujuan pembelajaran.<\/p>\n<p>Membaca dengan cermat, termasuk judul, pembuka, isi, dan penutup.<\/p>\n<p>Menemukan gagasan utama dan informasi pendukung.<\/p>\n<p>Mencatat fakta dan opini serta memeriksa sumbernya.<\/p>\n<p>Menulis ringkasan dengan kalimat sendiri tanpa mengubah makna asli.<\/p>\n<p>Menulis tanggapan, hal yang belum dipahami, dan pertanyaan lanjutan.<\/p>\n<p>Menghubungkan bacaan dengan ide artikel dan mencatat sumbernya.<\/p>\n<h2 id=\"e.-contoh-jurnal-membaca\">E. Contoh Jurnal Membaca<\/h2>\n<p>Contoh berikut merupakan simulasi pembelajaran, bukan kutipan dari artikel tertentu.<\/p>\n<p><strong>Judul bacaan:<\/strong> “Mengurangi Sampah Plastik di Sekolah”<\/p>\n<p>Topik: Pengelolaan sampah plastik.<\/p>\n<p>Ringkasan: Sampah plastik dapat menimbulkan masalah lingkungan jika tidak dikelola dengan baik. Upaya pengurangan sampah dapat dilakukan dengan menggunakan kembali barang yang masih layak, mengurangi barang sekali pakai, dan memilah sampah sesuai jenisnya.<\/p>\n<p>Informasi penting:<\/p>\n<p>Plastik sekali pakai dapat menjadi sumber sampah.<\/p>\n<p>Pengurangan sampah dapat dimulai dari kebiasaan sehari-hari.<\/p>\n<p>Pemilahan sampah membantu proses pengelolaan selanjutnya.<\/p>\n<p>Kosakata baru:<\/p>\n<p>Daur ulang: proses mengolah kembali bahan atau barang menjadi bahan atau produk yang dapat digunakan.<\/p>\n<p>Terurai: mengalami proses pemecahan menjadi bagian atau zat yang lebih sederhana.<\/p>\n<p>Tanggapan pembaca: Saya memahami bahwa kebiasaan kecil di sekolah dapat membantu mengurangi sampah jika dilakukan secara konsisten.<\/p>\n<p>Pertanyaan lanjutan: Jenis sampah apa yang paling banyak dihasilkan oleh siswa di sekolah saya?<\/p>\n<p>Kaitan dengan artikel: Informasi ini dapat menjadi dasar untuk melakukan pengamatan tentang jenis sampah yang ditemukan di kantin sekolah.<\/p>\n<h2 id=\"f.-template-jurnal-membaca\">F. Template Jurnal Membaca<\/h2>\n<p>Gunakan format berikut untuk tugas membaca siswa.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Bagian<\/strong><\/th>\n<th><strong>Catatan siswa<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Tanggal membaca<\/td>\n<td>……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Judul bacaan<\/td>\n<td>……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Penulis atau sumber<\/td>\n<td>……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Topik<\/td>\n<td>……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ringkasan bacaan<\/td>\n<td>………………………………………………………. ……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Fakta penting<\/td>\n<td>………………………………………………………. ……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Opini penulis<\/td>\n<td>………………………………………………………. ……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kosakata baru dan makna<\/td>\n<td>………………………………………………………. ……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tanggapan dan pertanyaan<\/td>\n<td>………………………………………………………. ……………………………………………………….<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kaitan dengan artikel<\/td>\n<td>………………………………………………………. ……………………………………………………….<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"g.-latihan-memahami-bacaan\">G. Latihan Memahami Bacaan<\/h2>\n<p>Bacalah teks berikut: “Sekolah dapat mengurangi sampah dengan menyediakan tempat sampah terpilah. Siswa juga dapat membawa botol minum yang dapat digunakan berulang kali. Menurut saya, kebiasaan membawa botol minum sendiri merupakan salah satu langkah yang mudah dilakukan untuk mengurangi penggunaan botol plastik sekali pakai.”<\/p>\n<ol type=\"1\">\n<li>Pernyataan manakah yang secara jelas menunjukkan opini penulis?<\/li>\n<\/ol>\n<p>A. Sekolah dapat menyediakan tempat sampah terpilah.<\/p>\n<p>B. Menurut saya, membawa botol minum sendiri merupakan langkah yang mudah dilakukan.<\/p>\n<p>C. Siswa membawa botol minum yang dapat digunakan berulang kali.<\/p>\n<ol start=\"2\" type=\"1\">\n<li>Informasi apa yang dapat dikembangkan menjadi topik artikel?<\/li>\n<\/ol>\n<p>A. Kebiasaan siswa membawa botol minum sendiri.<\/p>\n<p>B. Kisah khayalan tentang botol yang dapat berbicara.<\/p>\n<p>C. Cerita perjalanan ke luar angkasa.<\/p>\n<details><summary>Lihat kunci jawaban<\/summary><p> 1. B; 2. A.<\/p><\/details>\n", "soal": [{"q": "Catatan yang dibuat pembaca untuk mendokumentasikan informasi, pemahaman, dan tanggapan dari suatu bacaan di }

function optionsHTML(q){
  return q.o.map((t, i) => `<button class="opt" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span>${t}</span></button>`).join('');
}
function bindQuiz(box, q, onAnswer){
  const card = box.querySelector('.qcard'), opts = [...box.querySelectorAll('.opt')], fb = box.querySelector('.fb');
  opts.forEach(btn => btn.onclick = () => {
    const pick = +btn.dataset.i, ok = pick === q.a;
    opts.forEach(o => { o.disabled = true; });
    opts[q.a].classList.add('right');
    if (!ok) { btn.classList.add('wrong'); opts.forEach((o, i) => { if (i !== q.a && i !== pick) o.classList.add('dim'); }); }
    card.classList.add(ok ? 'right' : 'wrong');
    if (!ok) { card.classList.add('shake'); }
    fb.className = 'fb ' + (ok ? 'right' : 'wrong');
    fb.textContent = ok ? '✅ Benar! Jawaban kamu tepat.' : '❌ Kurang tepat. Jawaban yang benar: ' + 'ABCD'[q.a] + '.';
    const advance = box.querySelector('.auto-next'); if (advance) advance.hidden = false;
    const after = box.querySelector('.after'); if (after) after.hidden = false;
    onAnswer(ok, pick);
  });
}

function iconFor(text){
  const t = text.toLowerCase();
  if(/fakta|opini/.test(t)) return '🔎';
  if(/data|observasi|wawancara|angket|dokumentasi/.test(t)) return '📊';
  if(/analogi|sinonim|antonim|perbandingan/.test(t)) return '🔤';
  if(/langkah|proses|menulis|kerangka|penyunting/.test(t)) return '✍️';
  if(/jurnal|membaca/.test(t)) return '📚';
  if(/ciri/.test(t)) return '✨';
  if(/contoh/.test(t)) return '💡';
  if(/tujuan/.test(t)) return '🎯';
  return '📖';
}
function decorateLesson(html, no){
  const template = document.createElement('template');
  template.innerHTML = html;
  const nodes = [...template.content.children];
  const removeTitles = {1:['F. Aktivitas Interaktif'],2:['I. Aktivitas Interaktif'],3:['F. Latihan'],4:['G. Latihan'],5:['G. Latihan'],6:['J. Latihan'],7:['G. Latihan']};
  const shouldRemove = h => (removeTitles[no] || []).some(x => h.trim().toLowerCase() === x.toLowerCase());
  // Satu kartu untuk setiap bagian berhuruf (A., B., C., dan seterusnya).
  // Paragraf, contoh, tabel, daftar, dan subjudul di dalam bagian tetap menyatu.
  const groups = [];
  let current = null, skipping = false;
  for(const el of nodes){
    if(el.tagName === 'H2'){
      const title = el.textContent.trim();
      if(shouldRemove(title)){ current = null; skipping = true; continue; }
      if(/^[A-Z]\.\s*/.test(title)){
        current = {title, items:[]};
        groups.push(current);
        skipping = false;
      } else if(!skipping && current){
        // Judul tambahan yang bukan bagian A/B/C menjadi subjudul dalam kartu aktif.
        const sub = document.createElement('h3');
        sub.className = 'lesson-subheading';
        sub.innerHTML = `<span aria-hidden="true">${iconFor(title)}</span> ${el.innerHTML}`;
        current.items.push(sub);
      }
      continue;
    }
    if(skipping || !current) continue;
    current.items.push(el);
  }
  const art = `<svg viewBox="0 0 260 116" role="img" aria-label="Ilustrasi belajar" class="lesson-art"><circle cx="218" cy="29" r="19" fill="#ffca68"/><path d="M16 91 Q72 64 127 91 T244 88" fill="none" stroke="currentColor" stroke-width="3" opacity=".25"/><rect x="67" y="23" width="105" height="72" rx="9" fill="#dcecfd" stroke="#1e88e5" stroke-width="2"/><path d="M83 42h72M83 55h58M83 68h64M83 81h42" stroke="#1e88e5" stroke-width="4" stroke-linecap="round"/><path d="M38 30l8 8 16-18" fill="none" stroke="#2e9e5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205" cy="77" r="13" fill="#bdebd0"/><path d="M200 77l4 4 7-9" fill="none" stroke="#218653" stroke-width="3" stroke-linecap="round"/></svg>`;
  return `<div class="lesson-illustration">${art}<div><span class="eyebrow">📘 MATERI PEMBELAJARAN</span><h2>Jelajahi, pahami, dan temukan hal baru!</h2><p>Pelajari setiap bagian secara bertahap. Catat informasi penting dan hubungkan dengan kehidupan sehari-hari.</p></div></div>` +
    groups.map(g => {
      const heading = `<div class="section-heading"><span class="section-icon">${iconFor(g.title)}</span><h2>${g.title}</h2></div>`;
      const content = g.items.map(el => {
        if(el.tagName === 'H3') return `<h3 class="lesson-subheading"><span aria-hidden="true">${iconFor(el.textContent)}</span> ${el.innerHTML}</h3>`;
        return el.outerHTML;
      }).join('');
      return `<section class="lesson-section section-card">${heading}<div class="section-body">${content}</div></section>`;
    }).join('');
}

function pageFinal(){
  const all = [];
  DATA.bab.forEach(b => b.soal.forEach((q, i) => all.push({ id: b.no + '-' + i, q, bab: b.no })));
  let used = new Set(), round = [], idx = 0, results = [];
  const pick = () => {
    let pool = all.filter(x => !used.has(x.id));
    if (pool.length < 5) { used = new Set(); pool = all.slice(); }
    round = shuffle(pool).slice(0, 5);
    round.forEach(x => used.add(x.id));
    idx = 0; results = [];
  };
  const intro = () => {
    app.innerHTML = `<div class="pagehead"><div class="n">🏆</div><div><small>Evaluasi Bab 3</small><h1>Kuis Akhir</h1></div></div>

      <button class="btn" id="go">Mulai Kuis ▶</button></section>`;

  };
  const show = () => {

    app.innerHTML = `<div class="pagehead"><div class="n">🏆</div><div><small>Kuis Akhir</small><h1>Soal ${idx + 1} dari 5</h1></div></div>
      <section class="card qwrap">

        <div class="bar"><i style="width:${idx / 5 * 100}%"></i></div>
        <div id="qbox"><div class="qcard"><p class="qtext">${q.q}</p>${optionsHTML(q)}<p class="fb" aria-live="polite"></p>
        <div class="auto-next" hidden><span>⏳ ${idx < 4 ? 'Soal berikutnya segera muncul…' : 'Menyiapkan rekap nilai…'}</span><div class="mini-progress"><i></i></div></div></div></div></section>`;
    bindQuiz($('#qbox'), q, (ok, p) => { results.push({ it, ok, p }); setTimeout(() => { idx++; idx < 5 ? show() : recap(); }, 1700); });
  };
  const recap = () => {
    const right = results.filter(r => r.ok).length, nilai = right * 20;
    const msg = nilai === 100 ? 'Luar biasa! Sempurna 🎉' : nilai >= 80 ? 'Hebat! Pertahankan 👏' : nilai >= 60 ? 'Bagus, tingkatkan lagi 💪' : 'Ayo pelajari materinya lagi 📖';
    app.innerHTML = `<div class="pagehead"><div class="n">📊</div><div><small>Kuis Akhir</small><h1>Rekap Nilai</h1></div></div>
      <section class="card"><div class="score"><div class="big">${nilai}</div>
        <p style="margin:6px 0"><b>${right}</b> benar dari <b>5</b> soal</p><p style="margin:0;color:var(--muted);font-weight:700">${msg}</p></div>
        <ul class="rev">${results.map((r, i) => `<li class="${r.ok ? 'ok' : 'no'}"><b>${i + 1}. ${r.ok ? '✅' : '❌'}</b> ${r.it.q.q}
          <small>Jawabanmu: ${'ABCD'[r.p]}. ${r.it.q.o[r.p]}</small>${r.ok ? '' : `<small style="color:var(--ok);font-weight:700">Jawaban benar: ${'ABCD'[r.it.q.a]}. ${r.it.q.o[r.it.q.a]}</small>`}</li>`).join('')}</ul>
        <button class="btn" id="again">Kuis Acak Lainnya ↻</button><a class="btn ghost" href="#beranda">Ke Beranda</a></section>`;
    $('#again').onclick = () => { pick(); show(); scrollTo({ top: 0 }); };
  };
  intro();
}

  const act = nav.querySelector('a.active'); if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  closeMenu(); scrollTo({ top: 0 });
}
